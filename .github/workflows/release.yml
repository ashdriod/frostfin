# Push a tag like v1.2.0 (see CONTRIBUTING.md) to publish a release.
# The tag must match package.json's version. Assets are built here from the
# tagged source, tested, checksummed and given a build-provenance attestation.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$v" ] || { echo "Tag $TAG does not match package.json version $v"; exit 1; }
      - name: Build
        run: npm run build && git diff --exit-code -- dist/
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm test
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          cp dist/theme.css dist/theme.min.css dist/theme.js dist/theme.min.js out/
          zip -j "out/frostfin-$TAG.zip" dist/* LICENSE NOTICE.md README.md
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Install"
            echo
            echo "Paste into Dashboard → General → Branding → Custom CSS code:"
            echo
            echo '```css'
            echo "@import url(\"https://cdn.jsdelivr.net/gh/$REPO@$TAG/dist/theme.min.css\");"
            echo '```'
            echo
            echo "Optional companion script: paste \`theme.js\` into the JavaScript Injector plugin, then reload with Ctrl/Cmd+Shift+R."
            echo
            echo "Verify a download: \`gh attestation verify <file> --repo $REPO\`"
          } > notes.md
          gh release create "$TAG" out/* --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
      - name: Refresh jsDelivr @latest
        env:
          REPO: ${{ github.repository }}
        run: |
          for f in theme.css theme.min.css theme.js theme.min.js; do
            curl -fsS "https://purge.jsdelivr.net/gh/$REPO@latest/dist/$f" > /dev/null || true
          done
